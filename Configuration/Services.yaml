services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  Extension14v\AccessibleChatbot\:
    resource: '../Classes/*'
    exclude:
      # Reine Datenklassen und Ausnahmen sind keine Services - sie werden
      # mit "new" erzeugt und haben keine Abhaengigkeiten.
      - '../Classes/Ai/AiProviderException.php'
      - '../Classes/Ai/AiResult.php'
      - '../Classes/Ai/ChatAction.php'
      - '../Classes/Ai/ChatMessage.php'
      - '../Classes/Ai/ChatRole.php'
      - '../Classes/Ai/ProviderOptions.php'
      - '../Classes/Configuration/ChatbotConfiguration.php'
      - '../Classes/Event/ModifyPageIndexRecordEvent.php'
      - '../Classes/Http/ChatRequestPayload.php'
      - '../Classes/Http/GenderStyle.php'
      - '../Classes/Http/InvalidChatRequestException.php'

  # Solange es nur einen Anbieter gibt, ist der Alias die einfachste Loesung.
  # Kommt spaeter ein zweiter Adapter dazu, wird hier eine Factory eingetragen -
  # ChatService, Middleware und Frontend bleiben unveraendert.
  Extension14v\AccessibleChatbot\Ai\AiProviderInterface:
    alias: Extension14v\AccessibleChatbot\Ai\GeminiProvider

  # Muss oeffentlich sein: TYPO3s MiddlewareDispatcher holt die Middleware
  # ueber $container->get(Klassenname) aus dem Container.
  Extension14v\AccessibleChatbot\Middleware\ChatEndpointMiddleware:
    public: true

  # CLI-Befehl. Configuration/Commands.php ist seit TYPO3 v10.3 veraltet;
  # nur ueber diesen Tag laesst sich "schedulable" steuern, das den Befehl
  # im Scheduler auswaehlbar macht. Oeffentlich muss der Service hier nicht
  # sein - das erledigt TYPO3s ConsoleCommandPass automatisch.
  Extension14v\AccessibleChatbot\Command\IndexCommand:
    tags:
      - name: 'console.command'
        command: 'accessible-chatbot:index'
        description: 'Baut den Inhaltsindex des barrierefreien Chatbots neu auf.'
        schedulable: true

  # Muss oeffentlich sein: der DataHandler holt Hook-Objekte ueber
  # GeneralUtility::makeInstance(). Die fragt den Container aber nur, wenn
  # dieser den Dienst kennt - und Symfony kennt nur oeffentliche Dienste.
  # Ohne "public: true" wuerde TYPO3 "new IndexUpdateHook()" ohne Argumente
  # versuchen und bei jedem Speichern im Backend abstuerzen.
  Extension14v\AccessibleChatbot\Hook\IndexUpdateHook:
    public: true
