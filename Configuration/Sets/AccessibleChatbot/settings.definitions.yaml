categories:
  accessiblechatbot:
    label: 'Barrierefreier Chatbot'

settings:
  accessiblechatbot.enabled:
    label: 'Chatbot aktivieren'
    description: 'Blendet das Chat-Widget im Frontend dieser Website ein. Solange die Einstellung aus ist, wird weder Markup noch CSS noch JavaScript ausgeliefert.'
    category: accessiblechatbot
    type: bool
    default: false

  accessiblechatbot.botName:
    label: 'Name des Assistenten'
    description: 'Wird in der Kopfzeile des Chatfensters und vor jeder Antwort angezeigt.'
    category: accessiblechatbot
    type: string
    default: 'Assistent'

  accessiblechatbot.headingLevel:
    label: 'Überschriften-Ebene im Chatfenster'
    description: 'Ebene der Überschrift im Chatfenster (2 bis 6). Sie sollte zur Überschriften-Gliederung der Website passen, damit der Chat die Gliederung der Seite nicht stört. Standard ist 2.'
    category: accessiblechatbot
    type: int
    default: 2

  accessiblechatbot.salutation:
    label: 'Anrede der Antworten'
    description: 'Erlaubte Werte: "sie" oder "du". Legt fest, wie der Assistent die Besucherinnen und Besucher anspricht.'
    category: accessiblechatbot
    type: string
    default: 'sie'

  accessiblechatbot.genderStyleDefault:
    label: 'Voreingestellte Sprachform'
    description: 'Erlaubte Werte: "neutral", "pair" oder "asterisk". neutral = ohne Geschlechtsbezug formulieren (Erstempfehlung des DBSV), pair = beide Formen ausschreiben, asterisk = Kurzform mit Sternchen. Besucherinnen und Besucher koennen die Form im Chatfenster selbst umstellen.'
    category: accessiblechatbot
    type: string
    default: 'neutral'

  accessiblechatbot.starterQuestions:
    label: 'Vorgeschlagene Einstiegsfragen'
    description: 'Bis zu vier Fragen, getrennt durch einen senkrechten Strich "|". Sie erscheinen als Knoepfe unter der Begruessung. Beispiel: Wann habt ihr geoeffnet?|Wo finde ich den Kontakt? Leer = keine Vorschlaege.'
    category: accessiblechatbot
    type: string
    default: ''

  accessiblechatbot.readAloudEnabled:
    label: 'Vorlesefunktion anbieten'
    description: 'Zeigt an jeder Antwort einen Knopf "Antwort vorlesen". Vorgelesen wird nur der Antworttext und nur nach einem Klick. Benoetigt die Sprachausgabe des Browsers.'
    category: accessiblechatbot
    type: bool
    default: true

  accessiblechatbot.privacyPageUid:
    label: 'Seite mit der Datenschutzerklaerung'
    description: 'Wird als Link im Hinweistext des Chatfensters angezeigt. Keine Auswahl = kein Link.'
    category: accessiblechatbot
    type: page
    default: 0

  accessiblechatbot.contactPageUid:
    label: 'Kontaktseite'
    description: 'Weg zu einem Menschen (COGA 4.8.1). Der Link steht dauerhaft im Chatfenster, nicht nur im Fehlerfall. Faktische Pflichtangabe: ohne Kontaktseite hat der Chatbot keinen Notausgang. Keine Auswahl = kein Link.'
    category: accessiblechatbot
    type: page
    default: 0

  accessiblechatbot.maxIndexPagesFullSitemap:
    label: 'Seitenliste vollstaendig bis'
    description: 'Ab dieser Anzahl indexierter Seiten bekommt der Assistent nur noch die oberen Ebenen des Seitenbaums (bis Ebene 2) statt der vollstaendigen Liste. Das haelt die Anfrage an den KI-Dienst klein und schnell.'
    category: accessiblechatbot
    type: int
    default: 150
